<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="USER_BROWSE.css" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="dashboard-title">
            <img id="menuToggle" src="assets/LOGO_BOOK.png" alt="Logo" />
            <span style="font-size: 20px; font-weight: bold;">Browse</span>
          </div>
      </header>
      
      <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img id="menuToggle" src="assets/LOGO_BOOK.png" alt="Sidebar Logo" />
            </div>
            <ul class="sidebar-menu">
                <li><a href="USER_LIBRARY.html"><img src="assets/library.png" alt="library" />Library</a></li>
                <li><a href="USER_BOOKING.html"><img src="assets/booking.png" alt="booking" />Booking</a></li>
                <li><a href="USER_BROWSE.html"><img src="assets/browse.png" alt="browse" />Browse</a></li>
                <li><a href="LOGIN.html"><img src="assets/logout.png" alt="logout" />Logout</a></li>
            </ul>
      </div>

      <div class="container">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search a book" />
          <button onclick="searchBook()">
            🔍
          </button>
        </div>
    
        <div class="genres">
          <label>Genres</label>
          <div class="genre-buttons">
            <button onclick="filterGenre('Fiction')">Fiction</button>
            <button onclick="filterGenre('Non-fiction')">Non-fiction</button>
            <button onclick="filterGenre('Sci-fi')">Sci-fi</button>
            <button onclick="filterGenre('Mystery')">Mystery</button>
            <button onclick="filterGenre('Romance')">Romance</button>
            <button onclick="filterGenre('Biography')">Biography</button>
            <button onclick="filterGenre('More')">...</button>
          </div>
        </div>
    
        <div class="recent">
          <h3>Recently browse</h3>
          <div class="recent-items">
            <div class="book-placeholder">X</div>
            <div class="book-placeholder">X</div>
          </div>
        </div>
      </div>

    <script>
        const toggleBtns = document.querySelectorAll("#menuToggle");
        const sidebar = document.getElementById("sidebar");
    
        toggleBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            sidebar.classList.toggle("active");
        });
        });
    </script>

</body>
</html>
