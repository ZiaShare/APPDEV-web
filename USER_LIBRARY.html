<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="USER_LIBRARY.css" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="dashboard-title">
            <img id="menuToggle" src="assets/LOGO_BOOK.png" alt="Logo" />
            <span style="font-size: 20px; font-weight: bold;">Library</span>
          </div>
          <button class="sort-button">
            <img src="assets/sort-icon.png" alt="Sort" />
          </button>
      </header>
      
      <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img id="menuToggle" src="assets/LOGO_BOOK.png" alt="Sidebar Logo" />
            </div>
            <ul class="sidebar-menu">
                <li><a href="USER_LIBRARY.html"><img src="assets/library.png" alt="library" />Library</a></li>
                <li><a href="USER_BOOKING.html"><img src="assets/booking.png" alt="booking" />Booking</a></li>
                <li><a href="USER_BROWSE.html"><img src="assets/browse.png" alt="browse" />Browse</a></li>
                <li><a href="LOGIN.html"><img src="assets/logout.png" alt="logout" />Logout</a></li>
            </ul>
      </div>

      <main class="library-container">
        <div class="book-grid">
          <a href="ABOUT_BOOK.html" class="book-link">
            <div class="book-box"></div>
          </a>
          <a href="ABOUT_BOOK.html" class="book-link">
            <div class="book-box"></div>
          </a>
          <a href="ABOUT_BOOK.html" class="book-link">
            <div class="book-box"></div>
          </a>
          <a href="ABOUT_BOOK.html" class="book-link">
            <div class="book-box"></div>
          </a>
          <a href="ABOUT_BOOK.html" class="book-link">
            <div class="book-box"></div>
          </a>
          <a href="ABOUT_BOOK.html" class="book-link">
            <div class="book-box"></div>
          </a>
        </div>
      </main>



      <script>
        const toggleBtns = document.querySelectorAll("#menuToggle");
        const sidebar = document.getElementById("sidebar");
    
        toggleBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            sidebar.classList.toggle("active");
        });
        });
    </script>

</body>
</html>
